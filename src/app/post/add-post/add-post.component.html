<div class="add-container">
    <form [formGroup]="addForm" (ngSubmit)="onAdd()">
        <h1>Add new post</h1> <br>
        <input type="file" formControlName="image" (change)="onFileSelected($event)" required accept="image/*">
        <div *ngIf="addForm.get('image')?.invalid && addForm.get('image')?.touched">
          <small *ngIf="addForm.get('image')?.errors?.['required']">Image is required.</small>
        </div>
        <input type="text" formControlName="description" placeholder="Add your description" required>
        <div *ngIf="addForm.get('description')?.invalid && addForm.get('description')?.touched">
          <small *ngIf="addForm.get('description')?.errors?.['required']">Description is required.</small>
        </div>
        <div class="address">
            <input type="number" formControlName="longitude" placeholder="Longitude" required>
            <div *ngIf="addForm.get('longitude')?.invalid && addForm.get('longitude')?.touched">
              <small *ngIf="addForm.get('longitude')?.errors?.['required']">Longitude is required.</small>
            </div>
            <input type="number" formControlName="latitude" placeholder="Latitude" required>
            <div *ngIf="addForm.get('latitude')?.invalid && addForm.get('latitude')?.touched">
                <small *ngIf="addForm.get('latitude')?.errors?.['required']">Latitude is required.</small>
            </div>
            <button type="button" (click)="openMapModal($event)">Address</button>
        </div>

        <button mat-raised-button type="submit">Add Post</button>
    </form>
</div>

<div class="modal" *ngIf="addLocation" (click)="closeMapModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <span class="close" (click)="closeMapModal()">&times;</span>
        <app-map [latitude]="addForm.get('latitude')?.value ?? undefined" [longitude]="addForm.get('longitude')?.value ?? undefined" (mapClick)="addedLocation($event)"></app-map>
    </div>
</div>
